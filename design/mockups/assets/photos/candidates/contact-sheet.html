<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;padding:32px;background:#f4f5f7;font-family:"Malgun Gothic",sans-serif;color:#1b1f24}
.row{display:grid;grid-template-columns:200px 1fr 1fr;gap:16px;align-items:center;margin-bottom:16px}

figure{margin:0;position:relative}

figcaption{position:absolute;left:10px;top:10px;background:#fff;font-weight:700;font-size:14px;padding:2px 9px;border-radius:4px}
</style></head><body>
